# Pairs of production runs that measure one feature's effect: `with` uses the feature, `without` does not, at
# the same condition. Names are run folders under the main repo's runs/ (RUNS in provenance.py) unless absolute.
# Source of each pair: the diary entry named in `diary`. tools/ledger/provenance.py decides per pair whether the
# two runs share a source (clean) or not (confounded); a confounded pair is reported, never averaged in.
restart_label:            # restart ramps from the forcing that made the state (label), not from rest
  flag: null
  diary: "2026-11-13 L9 A/B (job 9007211) and the 7 reruns *_fix; fig9 37.5 rpm ext1 A/B (job 9004553)"
  qoi: [dtmix_0.25, dtmix_0.50, edr_95, tau_95_qss]
